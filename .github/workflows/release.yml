name: Build Debug APK

on:
  workflow_dispatch:      # 1. Allows you to click "Run" manually
  push:
    tags:
      - 'v*'              # 2. Also runs if you create a tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # FIXES ERROR 126 (Permission Denied)
      - name: Make gradlew executable
        run: chmod +x gradlew

      # FIXES ERROR 2 (Missing Key) - Builds a test version instead
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # FIXES MISSING FILE ERROR - Finds the APK wherever it is
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-debug
          path: '**/*.apk'
